# Cursor subagent 模型路由建议（非强制）
# 实现/审查优先使用 .cursor/agents/harness-*；未指定 model 时继承主 Agent。

roles:
  leader:
    description: 主 Agent 编排、整合、验证
    subagent: null
    model: inherit

  harness_explorer:
    description: 只读探查
    subagent: harness-explorer
    readonly: true
    model: fast

  harness_implementer:
    description: 有界 WU 实现
    subagent: harness-implementer
    model: inherit

  harness_reviewer:
    description: 独立审查
    subagent: harness-reviewer
    readonly: true
    model: inherit

  harness_debugger:
    description: 根因调查
    subagent: harness-debugger
    model: inherit

  harness_test_engineer:
    description: 测试与 E2E 资产
    subagent: harness-test-engineer
    model: inherit

  shell_runner:
    description: 测试、构建、lint
    subagent_type: shell
    model: inherit

  ci_investigator:
    description: CI 失败分析
    subagent_type: ci-investigator
    model: inherit

defaults:
  max_parallel: 3
  max_parallel_cap: 5
