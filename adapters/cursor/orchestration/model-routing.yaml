# Cursor Task 模型路由建议（非强制）
# omx 有 omx setup 自动生成表；Cursor 由 Leader 在 Task 调用时可选指定 model。
# 未指定时继承主 Agent 默认模型。

roles:
  leader:
    description: 主 Agent 编排、整合、验证
    subagent_type: null  # 主线程
    model: inherit
    notes: 复杂路由与 worktree 拆分

  explore:
    description: 仓库搜索、符号映射、只读调查
    subagent_type: explore
    readonly: true
    model: fast   # 如 composer-2.5-fast / 低延迟模型
    reasoning: low

  implementer:
    description: 有界 WU 实现
    subagent_type: generalPurpose
    model: inherit
    reasoning: medium

  reviewer:
    description: 独立审查
    subagent_type: generalPurpose
    readonly: true
    model: inherit
    reasoning: high

  debugger:
    description: 根因调查
    subagent_type: explore
    readonly: true
    model: inherit
    reasoning: high

  shell_runner:
    description: 测试、构建、lint
    subagent_type: shell
    model: inherit

  ci_investigator:
    description: CI 失败分析
    subagent_type: ci-investigator
    model: inherit

# 映射到 Cursor Task 可用 model  slug 时，以当前 Cursor 版本文档为准。
# 仅当任务确实需要不同能力时指定 model；否则省略 model 参数继承 Leader。

defaults:
  max_parallel: 3
  max_parallel_cap: 5
